services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prices
      POSTGRES_USER: prices
      POSTGRES_PASSWORD: prices
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prices -d prices"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/prices
      DB_USERNAME: prices
      DB_PASSWORD: prices
      BINANCE_SYMBOL: ${BINANCE_SYMBOL:-BNBUSDT}
      BINANCE_POLL_INTERVAL: ${BINANCE_POLL_INTERVAL:-PT30S}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
